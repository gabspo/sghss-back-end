openapi: 3.0.0
info:
  title: SGHSS API
  description: OpenAPI 3 specification (generated) - core endpoints
  version: "1.0.0"
servers:
  - url: http://localhost:5000
    description: Local dev server
paths:
  /api/auth/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/login:
    post:
      summary: Login de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /api/usuarios:
    post:
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuário criado
    get:
      summary: Listar usuários
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
  /api/pacientes:
    post:
      summary: Criar paciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteCreate'
      responses:
        '201':
          description: Paciente criado
    get:
      summary: Listar pacientes
      responses:
        '200':
          description: Lista de pacientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Paciente'
components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
    UsuarioCreate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required: [username, email, password]
    Paciente:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cpf:
          type: string
    PacienteCreate:
      type: object
      properties:
        nome:
          type: string
        cpf:
          type: string
      required: [nome, cpf]
